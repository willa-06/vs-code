<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签选择器</title>
    <style>
        p {
            color: red;
        }
    </style>
    <!-- 选中同名标签设置相同样式，无法差异化同名标签样式 -->
</head>
<body>
    <p>这是p标签</p>
    <p>wdqfwfqe</p>
    <p>imjgjengvrwrtgerth4yhthnrthg</p>
</body>
</html>
