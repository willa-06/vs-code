<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后代选择器</title>
</head>
<style>
    /* div里面的span文字是红色 */
    /* 后代选择器，选中所有后代，包含儿孙重孙 */
    div span{
        color: red;
    }
</style>
<body>
    <span>span 标签</span>
    <div>
        <span>这是div 的儿子span</span>
        <p>
            <span>孙子span </span>
        </p>
    </div>
</body>
</html>
