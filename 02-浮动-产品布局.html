<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动-产品布局</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        li{
            list-style: none;
        }
        .product{
            margin: 50px auto;
            width: 1226px;
            height: 628px;
            background-color: pink;

        }
        .left{
         width: 234px;
         height: 628px;
         background-color: skyblue;
        }
        .right{
            width: 978px;
            height: 628px;
            background-color: brown;
        }
        .right{
            width: 234px;
            height: 300px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <!-- 版心：左右，右面：8个产品 -->
    <div class="product">
        <div class="left"></div>
        <div class="right">
            <ul>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>
</body>
</html>
