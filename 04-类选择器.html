<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 定义 */
        .red{
            color: red;
        }
        .size{
            font-size: 50px;
        }
    </style>
</head>
<body>
    <!-- 使用 -->
    <p class="red">1111111111111</p>
    <p>2222222222222</p>
    <div class="red size">111111111</div>
    <!-- 一个选择器可以使用多个类名，class属性值写多个类名，类名用空格隔开 -->
    <!-- 一个类选择器可以给多个标签使用 -->
</body>
</html>
